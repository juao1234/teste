<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake em HTML</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background-color: #0c0f14;
        color: #f5f7ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #1d1f27, #0c0f14 60%);
      }

      .container {
        width: min(92vw, 520px);
        display: grid;
        gap: 16px;
        text-align: center;
        padding: 20px;
        border-radius: 20px;
        background: rgba(12, 15, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      canvas {
        width: 100%;
        height: auto;
        background: #0f1218;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
        display: block;
      }

      .panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: rgba(22, 26, 34, 0.9);
        border-radius: 12px;
        font-size: 0.95rem;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 8px 18px;
        font-weight: 600;
        background: #4c6fff;
        color: white;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(1px);
        opacity: 0.85;
      }

      .instructions {
        font-size: 0.85rem;
        opacity: 0.8;
      }

      h1 {
        margin: 0;
        font-size: 1.8rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Snake</h1>
      <div class="panel">
        <div>Pontuação: <span id="score">0</span></div>
        <div>Melhor: <span id="best">0</span></div>
        <button id="restart">Reiniciar</button>
      </div>
      <canvas id="game" width="400" height="400"></canvas>
      <div class="instructions">
        Use as setas ou WASD para mover. Pegue as frutas e evite bater.
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const restartBtn = document.getElementById("restart");

      const gridSize = 20;
      const cellSize = canvas.width / gridSize;
      let snake;
      let direction;
      let pendingDirection;
      let food;
      let score = 0;
      let bestScore = Number(localStorage.getItem("snake-best")) || 0;
      bestEl.textContent = bestScore;
      let speed = 140;
      let intervalId;

      const resetGame = () => {
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        pendingDirection = direction;
        score = 0;
        scoreEl.textContent = score;
        speed = 140;
        spawnFood();
        if (intervalId) {
          clearInterval(intervalId);
        }
        intervalId = setInterval(tick, speed);
      };

      const spawnFood = () => {
        let position;
        do {
          position = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
          };
        } while (snake.some((segment) => segment.x === position.x && segment.y === position.y));
        food = position;
      };

      const drawRoundedRect = (x, y, size, radius) => {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + size - radius, y);
        ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
        ctx.lineTo(x + size, y + size - radius);
        ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
        ctx.lineTo(x + radius, y + size);
        ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      };

      const render = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#1b2230";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f97316";
        drawRoundedRect(food.x * cellSize, food.y * cellSize, cellSize, 6);
        ctx.fill();

        snake.forEach((segment, index) => {
          ctx.fillStyle = index === 0 ? "#4c6fff" : "#9fb3ff";
          const inset = index === 0 ? 1 : 3;
          drawRoundedRect(
            segment.x * cellSize + inset,
            segment.y * cellSize + inset,
            cellSize - inset * 2,
            6
          );
          ctx.fill();
        });
      };

      const tick = () => {
        direction = pendingDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        if (
          head.x < 0 ||
          head.x >= gridSize ||
          head.y < 0 ||
          head.y >= gridSize ||
          snake.some((segment) => segment.x === head.x && segment.y === head.y)
        ) {
          clearInterval(intervalId);
          intervalId = null;
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            localStorage.setItem("snake-best", bestScore);
          }
          if (score % 50 === 0 && speed > 70) {
            speed -= 10;
            clearInterval(intervalId);
            intervalId = setInterval(tick, speed);
          }
          spawnFood();
        } else {
          snake.pop();
        }

        render();
      };

      const setDirection = (x, y) => {
        if (direction.x === -x && direction.y === -y) {
          return;
        }
        pendingDirection = { x, y };
      };

      document.addEventListener("keydown", (event) => {
        switch (event.key) {
          case "ArrowUp":
          case "w":
          case "W":
            setDirection(0, -1);
            break;
          case "ArrowDown":
          case "s":
          case "S":
            setDirection(0, 1);
            break;
          case "ArrowLeft":
          case "a":
          case "A":
            setDirection(-1, 0);
            break;
          case "ArrowRight":
          case "d":
          case "D":
            setDirection(1, 0);
            break;
          default:
            break;
        }
      });

      restartBtn.addEventListener("click", resetGame);

      resetGame();
      render();
    </script>
  </body>
</html>
